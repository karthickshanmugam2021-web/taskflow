<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Todo App</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0d1a">
    <meta name="description" content="TaskFlow - A beautiful, modern todo app with glass morphism design">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --glass: rgba(255,255,255,0.07);
            --glass-border: rgba(255,255,255,0.15);
            --glass-hover: rgba(255,255,255,0.12);
            --bg1: #0d0d1a;
            --bg2: #11112a;
            --accent: #7c6fff;
            --accent2: #a78bfa;
            --accent3: #60a5fa;
            --pink: #f472b6;
            --cyan: #22d3ee;
            --green: #4ade80;
            --amber: #fbbf24;
            --red: #f87171;
            --text: #f1f0ff;
            --text2: #a89ec9;
            --text3: #6b6485;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg1);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
        }

        .app {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background: linear-gradient(160deg, #0d0d1a 0%, #13103a 50%, #0d1a2a 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
            z-index: 0;
        }
        .orb1 { width: 260px; height: 260px; background: rgba(124,111,255,0.2); top: -80px; right: -60px; }
        .orb2 { width: 200px; height: 200px; background: rgba(96,165,250,0.15); top: 200px; left: -80px; }
        .orb3 { width: 180px; height: 180px; background: rgba(244,114,182,0.1); bottom: 100px; right: -40px; }

        .header {
            position: relative; z-index: 2;
            padding: 52px 20px 16px;
            background: linear-gradient(180deg, rgba(124,111,255,0.1) 0%, transparent 100%);
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }

        .app-title { font-size: 26px; font-weight: 700; background: linear-gradient(135deg, #a78bfa, #60a5fa, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

        .date-badge {
            font-size: 11px; color: var(--text2);
            background: var(--glass); border: 1px solid var(--glass-border);
            padding: 5px 10px; border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .stats-row { display: flex; gap: 10px; }

        .stat-chip {
            flex: 1; text-align: center;
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 8px 6px;
            backdrop-filter: blur(12px);
        }
        .stat-chip .val { font-size: 18px; font-weight: 700; color: var(--accent2); }
        .stat-chip .lbl { font-size: 10px; color: var(--text3); margin-top: 1px; }

        .tabs {
            position: relative; z-index: 2;
            display: flex; gap: 0;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid var(--glass-border);
            padding: 0 20px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }

        .tab {
            padding: 11px 14px; font-size: 12px; font-weight: 500; cursor: pointer;
            color: var(--text3); border-bottom: 2px solid transparent;
            white-space: nowrap; transition: all 0.2s;
            background: none; border-top: none; border-left: none; border-right: none;
            display: flex; align-items: center; gap: 5px;
        }
        .tab.active { color: var(--accent2); border-bottom-color: var(--accent); }
        .tab:hover:not(.active) { color: var(--text2); }

        .tab-badge {
            background: var(--accent); color: white; border-radius: 10px;
            padding: 1px 6px; font-size: 10px; font-weight: 600; min-width: 16px; text-align: center;
        }
        .tab-badge.green { background: var(--green); color: #0a2a1a; }

        .content { flex: 1; position: relative; z-index: 2; overflow-y: auto; padding: 16px 20px 100px; scrollbar-width: none; }
        .content::-webkit-scrollbar { display: none; }

        .section-label {
            font-size: 10px; font-weight: 600; letter-spacing: 1.2px; color: var(--text3);
            text-transform: uppercase; margin: 14px 0 8px;
        }

        .task-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 13px 14px;
            margin-bottom: 9px;
            backdrop-filter: blur(20px);
            display: flex; align-items: flex-start; gap: 11px;
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
        }
        .task-card::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 60%);
            pointer-events: none;
        }
        .task-card:hover { background: var(--glass-hover); border-color: rgba(167,139,250,0.3); transform: translateY(-1px); }
        .task-card.done { opacity: 0.5; }
        .task-card.done .task-title { text-decoration: line-through; color: var(--text3); }

        .check-btn {
            width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--glass-border);
            background: transparent; cursor: pointer; flex-shrink: 0; margin-top: 1px;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
            font-size: 12px;
        }
        .check-btn.checked { background: var(--green); border-color: var(--green); }
        .check-btn:hover:not(.checked) { border-color: var(--green); background: rgba(74,222,128,0.1); }

        .task-body { flex: 1; min-width: 0; }
        .task-title { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 5px; line-height: 1.3; }
        .task-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }

        .cat-badge {
            font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 8px;
            border: 1px solid transparent;
        }
        .cat-work { background: rgba(124,111,255,0.2); color: var(--accent2); border-color: rgba(124,111,255,0.3); }
        .cat-personal { background: rgba(244,114,182,0.2); color: var(--pink); border-color: rgba(244,114,182,0.3); }
        .cat-health { background: rgba(74,222,128,0.2); color: var(--green); border-color: rgba(74,222,128,0.3); }
        .cat-study { background: rgba(96,165,250,0.2); color: var(--accent3); border-color: rgba(96,165,250,0.3); }
        .cat-other { background: rgba(251,191,36,0.2); color: var(--amber); border-color: rgba(251,191,36,0.3); }

        .due-tag {
            font-size: 10px; color: var(--text3); display: flex; align-items: center; gap: 3px;
        }
        .due-tag.overdue { color: var(--red); }
        .due-tag.today { color: var(--amber); }

        .alarm-tag {
            font-size: 10px; color: var(--cyan); display: flex; align-items: center; gap: 3px;
        }

        .del-btn {
            background: none; border: none; cursor: pointer; color: var(--text3);
            padding: 4px; border-radius: 6px; flex-shrink: 0; font-size: 14px; transition: all 0.2s;
        }
        .del-btn:hover { color: var(--red); background: rgba(248,113,113,0.1); }

        .fab {
            position: fixed; bottom: 24px; right: calc(50% - 190px);
            width: 56px; height: 56px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--pink));
            border: none; cursor: pointer; font-size: 26px; color: white;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 32px rgba(124,111,255,0.5);
            transition: all 0.2s; z-index: 50;
        }
        .fab:hover { transform: scale(1.08); box-shadow: 0 12px 40px rgba(124,111,255,0.65); }

        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.7); z-index: 100;
            align-items: flex-end; justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.open { display: flex; }

        .modal {
            width: 100%; max-width: 420px;
            background: linear-gradient(180deg, #1a1535 0%, #0f1229 100%);
            border: 1px solid var(--glass-border);
            border-radius: 24px 24px 0 0;
            padding: 24px 20px 40px;
            backdrop-filter: blur(30px);
            max-height: 90vh; overflow-y: auto;
        }

        .modal-handle { width: 40px; height: 4px; background: var(--glass-border); border-radius: 2px; margin: 0 auto 20px; }
        .modal-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 18px; }

        .field-label { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 6px; }

        .field-input, .field-textarea, .field-select {
            width: 100%; background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 12px; color: var(--text); font-family: 'Inter', sans-serif;
            font-size: 14px; padding: 11px 14px; margin-bottom: 14px;
            outline: none; transition: border-color 0.2s;
            -webkit-appearance: none; appearance: none;
        }
        .field-input:focus, .field-textarea:focus, .field-select:focus { border-color: var(--accent); }
        .field-textarea { height: 70px; resize: none; }
        .field-select option { background: #1a1535; color: var(--text); }

        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .alarm-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .alarm-toggle {
            position: relative; width: 44px; height: 24px; flex-shrink: 0;
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 12px; cursor: pointer; transition: all 0.2s;
        }
        .alarm-toggle.on { background: var(--accent); border-color: var(--accent); }
        .alarm-toggle::after {
            content: ''; position: absolute; top: 3px; left: 3px;
            width: 16px; height: 16px; border-radius: 50%; background: white;
            transition: all 0.2s;
        }
        .alarm-toggle.on::after { left: 23px; }
        .alarm-label { font-size: 13px; color: var(--text2); }

        .alarm-time-input {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 10px; color: var(--text); font-family: 'Inter', sans-serif;
            font-size: 13px; padding: 8px 11px; outline: none; flex: 1;
            transition: border-color 0.2s;
        }
        .alarm-time-input:focus { border-color: var(--accent); }

        .btn-primary {
            width: 100%; padding: 14px; border-radius: 14px; border: none; cursor: pointer;
            background: linear-gradient(135deg, var(--accent), var(--pink));
            color: white; font-size: 15px; font-weight: 600; font-family: 'Inter', sans-serif;
            box-shadow: 0 6px 24px rgba(124,111,255,0.35); transition: all 0.2s; margin-top: 4px;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 32px rgba(124,111,255,0.5); }

        .btn-cancel {
            width: 100%; padding: 11px; border-radius: 14px;
            border: 1px solid var(--glass-border); cursor: pointer;
            background: var(--glass); color: var(--text2);
            font-size: 14px; font-family: 'Inter', sans-serif; margin-top: 8px; transition: all 0.2s;
        }
        .btn-cancel:hover { background: var(--glass-hover); }

        .empty-state { text-align: center; padding: 48px 20px; color: var(--text3); }
        .empty-state .icon { font-size: 40px; margin-bottom: 10px; }
        .empty-state p { font-size: 14px; }

        .notif-banner {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-80px);
            z-index: 200; max-width: 380px; width: calc(100% - 32px);
            background: linear-gradient(135deg, rgba(34,211,238,0.2), rgba(124,111,255,0.2));
            border: 1px solid var(--cyan); border-radius: 14px; padding: 12px 16px;
            backdrop-filter: blur(20px); display: flex; align-items: center; gap: 10px;
            transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
            pointer-events: none;
        }
        .notif-banner.show { transform: translateX(-50%) translateY(0); }
        .notif-icon { font-size: 20px; }
        .notif-text { flex: 1; }
        .notif-title { font-size: 13px; font-weight: 600; color: var(--cyan); }
        .notif-body { font-size: 11px; color: var(--text2); margin-top: 2px; }

        @media (max-width: 430px) {
            .fab { right: 16px; bottom: 20px; }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>

        <div class="header">
            <div class="header-top">
                <div class="app-title">✦ TaskFlow</div>
                <div class="date-badge" id="dateBadge"></div>
            </div>
            <div class="stats-row">
                <div class="stat-chip"><div class="val" id="statTotal">0</div><div class="lbl">Total</div></div>
                <div class="stat-chip"><div class="val" id="statDone" style="color:var(--green)">0</div><div class="lbl">Done</div></div>
                <div class="stat-chip"><div class="val" id="statPending" style="color:var(--amber)">0</div><div class="lbl">Pending</div></div>
                <div class="stat-chip"><div class="val" id="statAlarms" style="color:var(--cyan)">0</div><div class="lbl">Alarms</div></div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="setTab('all')">All <span class="tab-badge" id="badgeAll">0</span></button>
            <button class="tab" onclick="setTab('work')">Work</button>
            <button class="tab" onclick="setTab('personal')">Personal</button>
            <button class="tab" onclick="setTab('health')">Health</button>
            <button class="tab" onclick="setTab('study')">Study</button>
            <button class="tab" onclick="setTab('done')">Done <span class="tab-badge green" id="badgeDone">0</span></button>
        </div>

        <div class="content" id="taskList"></div>

        <button class="fab" onclick="openModal()" aria-label="Add task">+</button>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBg(event)">
        <div class="modal">
            <div class="modal-handle"></div>
            <div class="modal-title">New Task</div>

            <div class="field-label">Task title</div>
            <input class="field-input" id="taskTitle" placeholder="What needs to be done?" />

            <div class="field-label">Note (optional)</div>
            <textarea class="field-textarea" id="taskNote" placeholder="Add details..."></textarea>

            <div class="row2">
                <div>
                    <div class="field-label">Category</div>
                    <select class="field-select" id="taskCat">
                        <option value="work">Work</option>
                        <option value="personal">Personal</option>
                        <option value="health">Health</option>
                        <option value="study">Study</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div>
                    <div class="field-label">Due date</div>
                    <input class="field-input" type="date" id="taskDue" style="margin-bottom:0" />
                </div>
            </div>

            <div class="field-label" style="margin-top:4px">Reminder time</div>
            <div class="alarm-row">
                <div class="alarm-toggle" id="alarmToggle" onclick="toggleAlarm()"></div>
                <span class="alarm-label">Enable alarm</span>
                <input class="alarm-time-input" type="time" id="alarmTime" />
            </div>

            <button class="btn-primary" onclick="addTask()">Add Task</button>
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <div class="notif-banner" id="notifBanner">
        <div class="notif-icon">🔔</div>
        <div class="notif-text">
            <div class="notif-title" id="notifTitle"></div>
            <div class="notif-body" id="notifBody"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
